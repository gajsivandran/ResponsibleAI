<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor Response Judge</title>

    <!-- React and Babel loaded from CDNs so this works as a simple GitHub Page -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fafc;
        color: #111827;
        line-height: 1.5;
      }

      .page {
        max-width: 1050px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      .hero {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      h2 {
        margin-top: 0;
      }

      .subtitle {
        margin: 0;
        color: #4b5563;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 900px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      textarea {
        width: 100%;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 12px;
        font: inherit;
        background: #ffffff;
        margin-bottom: 16px;
      }

      textarea:focus {
        outline: 3px solid #bfdbfe;
        border-color: #2563eb;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        background: #2563eb;
        color: white;
        font-size: 1rem;
      }

      button:hover {
        background: #1d4ed8;
      }

      button.secondary {
        background: #e5e7eb;
        color: #111827;
        margin-left: 8px;
      }

      button.secondary:hover {
        background: #d1d5db;
      }

      .score-summary {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 20px;
        padding: 16px;
        border-radius: 14px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
      }

      .score-number {
        font-size: 2.4rem;
        font-weight: 800;
      }

      .score-label {
        color: #4b5563;
      }

      .rubric-item {
        border-top: 1px solid #e5e7eb;
        padding: 16px 0;
      }

      .rubric-item:first-of-type {
        border-top: none;
      }

      .rubric-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-weight: 800;
      }

      .score-pill {
        min-width: 48px;
        text-align: center;
        color: white;
        border-radius: 999px;
        padding: 2px 10px;
      }

      .bar-track {
        width: 100%;
        background: #e5e7eb;
        height: 9px;
        border-radius: 999px;
        margin-top: 8px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 999px;
      }

      .reasoning {
        margin: 10px 0 4px;
      }

      .suggestion {
        margin: 0;
        color: #374151;
      }

      .muted {
        color: #6b7280;
      }

      .empty-state {
        color: #6b7280;
        background: #f9fafb;
        border: 1px dashed #d1d5db;
        border-radius: 14px;
        padding: 18px;
      }

      .small-note {
        margin-top: 16px;
        color: #6b7280;
        font-size: 0.9rem;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // Color helper
      const scoreColor = (n) =>
        n <= 2 ? '#dc2626' : n === 3 ? '#f59e0b' : '#16a34a';

      // Rubric
      const RUBRIC = [
        { key: 'accuracy', label: 'Accuracy of Response' },
        { key: 'resistsShortcutting', label: 'Resists Shortcutting' },
        { key: 'activatesThinking', label: 'Activates Thinking' },
        { key: 'scaffolds', label: 'Scaffolds Appropriately' },
        { key: 'surfacesConcepts', label: 'Surfaces Concepts' },
        { key: 'checksUnderstanding', label: 'Checks Understanding' },
      ];

      // Clamp score
      function clamp(n) {
        return Math.max(1, Math.min(5, n));
      }

      // Heuristic judge
      function analyzeTranscript(text, question) {
        const cleanText = text || '';
        const cleanQuestion = question || '';
        const lower = cleanText.toLowerCase();
        const questionLower = cleanQuestion.toLowerCase();

        const sentences = cleanText
          .split(/[.!?]/)
          .filter((s) => s.trim().length > 0);

        const questionCount = (cleanText.match(/\?/g) || []).length;

        const hasMultiStep = sentences.length >= 3;

        const givesAnswerEarly =
          lower.trim().startsWith('the answer') ||
          lower.includes('the answer is') ||
          lower.includes('the derivative is') ||
          lower.includes('the correct answer is');

        const usesConceptLanguage =
          lower.includes('because') ||
          lower.includes('means') ||
          lower.includes('represents') ||
          lower.includes('concept') ||
          lower.includes('why');

        const checksUnderstanding =
          questionCount > 0 ||
          lower.includes('does that make sense') ||
          lower.includes('what do you think') ||
          lower.includes('can you explain');

        let accuracy = 1;
        if (questionLower.includes('x^2') && lower.includes('2x')) accuracy = 5;
        else if (questionLower.includes('derivative') && lower.includes('power rule')) accuracy = 4;
        else if (cleanText.length > 80) accuracy = 3;

        let resist = givesAnswerEarly ? 1 : questionCount >= 2 && hasMultiStep ? 5 : 3;

        let thinking = questionCount >= 3 ? 5 : questionCount >= 1 ? 3 : 1;

        let scaffold = hasMultiStep ? 4 : sentences.length >= 2 ? 3 : 1;

        let concepts = usesConceptLanguage ? 3 : 1;

        let check = checksUnderstanding ? 3 : 1;

        return {
          scores: {
            accuracy: clamp(accuracy),
            resistsShortcutting: clamp(resist),
            activatesThinking: clamp(thinking),
            scaffolds: clamp(scaffold),
            surfacesConcepts: clamp(concepts),
            checksUnderstanding: clamp(check),
          },
          reasoning: {
            accuracy: 'Basic heuristic check for correctness.',
            resistsShortcutting: givesAnswerEarly
              ? 'The response appears to give the answer too early.'
              : 'The response appears to give the student some space to think.',
            activatesThinking: questionCount > 0
              ? 'The response includes questions or prompts.'
              : 'The response does not include many thinking prompts.',
            scaffolds: hasMultiStep
              ? 'The response includes multi-step guidance.'
              : 'The response could use clearer step-by-step structure.',
            surfacesConcepts: usesConceptLanguage
              ? 'The response includes some conceptual explanation.'
              : 'The response focuses more on the answer than the concept.',
            checksUnderstanding: checksUnderstanding
              ? 'The response includes some follow-up or check for understanding.'
              : 'The response does not clearly check student understanding.',
          },
          suggestions: {
            accuracy: 'Make sure the response is correct, precise, and targeted to the question.',
            resistsShortcutting: 'Delay giving the final answer until the student has done some thinking.',
            activatesThinking: 'Ask the student to make a prediction, explain a step, or choose between options.',
            scaffolds: 'Break the help into smaller steps that guide without solving everything.',
            surfacesConcepts: 'Name the key concept and explain why it matters.',
            checksUnderstanding: 'End with a short follow-up question that checks understanding.',
          },
        };
      }

      // Score bar UI
      function ScoreBar({ score }) {
        return (
          <div className="bar-track">
            <div
              className="bar-fill"
              style={{
                width: `${(score / 5) * 100}%`,
                background: scoreColor(score),
              }}
            />
          </div>
        );
      }

      function ResultsPanel({ result }) {
        if (!result) {
          return (
            <div className="empty-state">
              Enter a student question and a tutor response, then click <strong>Judge Response</strong>.
            </div>
          );
        }

        const total = RUBRIC.reduce((sum, item) => sum + result.scores[item.key], 0);
        const average = (total / RUBRIC.length).toFixed(1);

        return (
          <>
            <div className="score-summary">
              <div className="score-number">{average}</div>
              <div className="score-label">average score out of 5</div>
            </div>

            {RUBRIC.map((item) => {
              const score = result.scores[item.key];

              return (
                <div className="rubric-item" key={item.key}>
                  <div className="rubric-header">
                    <span>{item.label}</span>
                    <span
                      className="score-pill"
                      style={{ background: scoreColor(score) }}
                    >
                      {score}/5
                    </span>
                  </div>

                  <ScoreBar score={score} />

                  <p className="reasoning">
                    <strong>Reasoning:</strong> {result.reasoning[item.key]}
                  </p>

                  <p className="suggestion">
                    <strong>Suggestion:</strong> {result.suggestions[item.key]}
                  </p>
                </div>
              );
            })}
          </>
        );
      }

      // Main App
      function App() {
        const [question, setQuestion] = useState('');
        const [response, setResponse] = useState('');
        const [result, setResult] = useState(null);

        const judge = () => {
          setResult(analyzeTranscript(response, question));
        };

        const clearAll = () => {
          setQuestion('');
          setResponse('');
          setResult(null);
        };

        return (
          <main className="page">
            <section className="hero">
              <h1>Tutor Response Judge</h1>
              <p className="subtitle">
                Paste a student question and a tutor response. This tool gives a quick heuristic score based on whether the response is accurate, scaffolded, and encourages student thinking.
              </p>
            </section>

            <section className="grid">
              <div className="card">
                <h2>Input</h2>

                <label htmlFor="question">Student question</label>
                <textarea
                  id="question"
                  rows="5"
                  placeholder="Example: What is the derivative of x^2?"
                  value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                />

                <label htmlFor="response">Tutor response or transcript</label>
                <textarea
                  id="response"
                  rows="12"
                  placeholder="Paste the tutor response here..."
                  value={response}
                  onChange={(e) => setResponse(e.target.value)}
                />

                <button onClick={judge}>Judge Response</button>
                <button className="secondary" onClick={clearAll}>Clear</button>

                <p className="small-note">
                  Note: This is a rule-based heuristic, not a full AI evaluator. It is useful for quick classroom testing, but scores should be interpreted as rough guidance.
                </p>
              </div>

              <div className="card">
                <h2>Rubric Results</h2>
                <ResultsPanel result={result} />
              </div>
            </section>
          </main>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
