<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor Response Judge</title>

    <!-- React and Babel loaded from CDNs so this works as a simple GitHub Page -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.22), transparent 32%),
          radial-gradient(circle at top right, rgba(22, 163, 74, 0.16), transparent 30%),
          linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #f0fdf4 100%);
        color: #111827;
        line-height: 1.5;
        min-height: 100vh;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 34px 20px 60px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.96), rgba(14, 165, 233, 0.9)),
          radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.45), transparent 34%);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 28px;
        padding: 34px;
        box-shadow: 0 22px 50px rgba(37, 99, 235, 0.22);
        margin-bottom: 24px;
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .hero::before {
        width: 220px;
        height: 220px;
        right: -70px;
        top: -80px;
      }

      .hero::after {
        width: 140px;
        height: 140px;
        right: 110px;
        bottom: -70px;
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 760px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }


      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3.1rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      h2 {
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .subtitle {
        margin: 0;
        color: rgba(255, 255, 255, 0.92);
        font-size: 1.05rem;
        max-width: 720px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 900px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.09);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 24px 50px rgba(15, 23, 42, 0.12);
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      textarea {
        width: 100%;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 16px;
        padding: 14px;
        font: inherit;
        background: #ffffff;
        margin-bottom: 16px;
        box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.05);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16), inset 0 1px 3px rgba(15, 23, 42, 0.05);
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        color: white;
        font-size: 1rem;
        box-shadow: 0 10px 22px rgba(37, 99, 235, 0.26);
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(0.98);
        box-shadow: 0 14px 28px rgba(37, 99, 235, 0.32);
      }

      button.secondary {
        background: #eef2ff;
        color: #1e3a8a;
        margin-left: 8px;
        box-shadow: none;
      }

      button.secondary:hover {
        background: #dbeafe;
      }

      .score-summary {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
        padding: 18px;
        border-radius: 20px;
        background: linear-gradient(135deg, #eff6ff, #ecfdf5);
        border: 1px solid rgba(37, 99, 235, 0.18);
        animation: revealPanel 0.55s ease both;
      }

      .score-number {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border-radius: 24px;
        background: white;
        color: #2563eb;
        font-size: 2.25rem;
        font-weight: 900;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.16);
        animation: scorePop 0.6s ease both;
      }

      .score-label {
        color: #374151;
        font-weight: 700;
      }

      .score-summary-text {
        flex: 1;
      }

      .total-score-track {
        width: 100%;
        height: 16px;
        margin-top: 12px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(37, 99, 235, 0.14);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 1px 4px rgba(15, 23, 42, 0.08);
      }

      .total-score-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #0ea5e9, #16a34a);
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        transition: width 3.2s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .rubric-item {
        border-top: 1px solid #e5e7eb;
        padding: 18px 0;
        opacity: 0;
        animation: rubricReveal 0.5s ease both;
      }

      .rubric-item:first-of-type {
        border-top: none;
      }

      .rubric-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-weight: 800;
      }

      .score-pill {
        min-width: 54px;
        text-align: center;
        color: white;
        border-radius: 999px;
        padding: 4px 11px;
        box-shadow: 0 8px 16px rgba(15, 23, 42, 0.14);
      }

      .bar-track {
        width: 100%;
        background: #e5e7eb;
        height: 11px;
        border-radius: 999px;
        margin-top: 10px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .reasoning {
        margin: 10px 0 4px;
      }

      .suggestion {
        margin: 0;
        color: #374151;
      }

      .muted {
        color: #6b7280;
      }

      .empty-state {
        color: #6b7280;
        background: linear-gradient(135deg, #f9fafb, #eff6ff);
        border: 1px dashed #93c5fd;
        border-radius: 18px;
        padding: 20px;
      }


      .red-flags {
        margin-bottom: 18px;
        padding: 16px 18px;
        border-radius: 18px;
        background: linear-gradient(135deg, #fff7ed, #fffbeb);
        border: 1px solid #fed7aa;
        box-shadow: 0 10px 22px rgba(249, 115, 22, 0.08);
        animation: revealPanel 0.55s ease 0.12s both;
      }

      .red-flags h3 {
        margin: 0 0 8px;
      }

      .red-flags ul {
        margin: 0;
        padding-left: 20px;
      }

      .evidence {
        margin: 10px 0 4px;
        color: #1f2937;
      }

      @keyframes revealPanel {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes scorePop {
        0% {
          opacity: 0;
          transform: scale(0.65) rotate(-3deg);
        }
        65% {
          opacity: 1;
          transform: scale(1.08) rotate(1deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes rubricReveal {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useState } = React;

      // Color helper
      const scoreColor = (n) =>
        n <= 2 ? '#dc2626' : n === 3 ? '#f59e0b' : '#16a34a';

      // Rubric
      const RUBRIC = [
        { key: 'resistsShortcutting', label: 'Resists Shortcutting' },
        { key: 'activatesThinking', label: 'Activates Thinking' },
        { key: 'scaffolds', label: 'Scaffolds Appropriately' },
        { key: 'surfacesConcepts', label: 'Surfaces Concepts' },
        { key: 'checksUnderstanding', label: 'Checks Understanding' },
      ];

      // Clamp score
      function clamp(n) {
        return Math.max(1, Math.min(5, n));
      }

      // Improved heuristic judge
      function analyzeTranscript(text, question) {
        const cleanText = (text || '').trim();
        const lower = cleanText.toLowerCase();

        const words = cleanText.match(/[A-Za-z0-9_]+/g) || [];
        const wordCount = words.length;
        const firstChunk = lower.slice(0, 180);
        const sentences = cleanText
          .split(/[.!?]+/)
          .map((s) => s.trim())
          .filter(Boolean);

        const questionMarks = [...cleanText].filter((ch) => ch === '?').length;

        const meaningfulQuestionPatterns = [
          /what do you notice/i,
          /what rule/i,
          /which rule/i,
          /what would/i,
          /what happens/i,
          /how do you know/i,
          /why/i,
          /can you/i,
          /try/i,
          /your reasoning/i,
          /in your own words/i,
          /before we/i,
          /where would you start/i,
        ];

        const scaffoldPatterns = [
          /first/i,
          /next/i,
          /then/i,
          /start by/i,
          /let's break/i,
          /one step/i,
          /step/i,
          /hint/i,
          /try/i,
          /look at/i,
          /compare/i,
          /instead of/i,
        ];

        const conceptPatterns = [
          /because/i,
          /means/i,
          /represents/i,
          /concept/i,
          /rule/i,
          /power rule/i,
          /slope/i,
          /rate of change/i,
          /derivative/i,
          /exponent/i,
          /coefficient/i,
          /constant/i,
          /chain rule/i,
          /product rule/i,
          /quotient rule/i,
        ];

        const understandingCheckPatterns = [
          /does that make sense/i,
          /can you explain/i,
          /can you tell me/i,
          /what would you do next/i,
          /in your own words/i,
          /try one/i,
          /now you try/i,
          /what do you think/i,
          /why do you think/i,
        ];

        const directAnswerPatterns = [
          /the answer is/i,
          /the derivative is/i,
          /the correct answer is/i,
          /final answer/i,
          /so the answer/i,
          /it is 2x/i,
          /^2x([^a-z0-9]|$)/i,
        ];

        const meaningfulQuestions = meaningfulQuestionPatterns.filter((p) => p.test(cleanText)).length;
        const scaffoldingMoves = scaffoldPatterns.filter((p) => p.test(cleanText)).length;
        const conceptMoves = conceptPatterns.filter((p) => p.test(cleanText)).length;
        const understandingChecks = understandingCheckPatterns.filter((p) => p.test(cleanText)).length;
        const givesAnswerEarly = directAnswerPatterns.some((p) => p.test(firstChunk));
        const givesFinalAnswerAnywhere = directAnswerPatterns.some((p) => p.test(cleanText));

        const asksButNoSubstance = questionMarks >= 3 && wordCount < 25;
        const tooShort = wordCount < 18;
        const hasMultiStep = sentences.length >= 3 || scaffoldingMoves >= 2;


        let resistsShortcutting = 3;
        if (givesAnswerEarly) resistsShortcutting = 1;
        else if (!givesFinalAnswerAnywhere && meaningfulQuestions >= 2) resistsShortcutting = 5;
        else if (!givesFinalAnswerAnywhere && meaningfulQuestions >= 1) resistsShortcutting = 4;

        let activatesThinking = 1;
        if (asksButNoSubstance) activatesThinking = 2;
        else if (meaningfulQuestions >= 3) activatesThinking = 5;
        else if (meaningfulQuestions >= 2) activatesThinking = 4;
        else if (meaningfulQuestions >= 1 || questionMarks >= 1) activatesThinking = 3;

        let scaffolds = 1;
        if (hasMultiStep && scaffoldingMoves >= 2) scaffolds = 5;
        else if (hasMultiStep || scaffoldingMoves >= 2) scaffolds = 4;
        else if (scaffoldingMoves >= 1 || sentences.length >= 2) scaffolds = 3;

        let surfacesConcepts = 1;
        if (conceptMoves >= 4) surfacesConcepts = 5;
        else if (conceptMoves >= 2) surfacesConcepts = 4;
        else if (conceptMoves >= 1) surfacesConcepts = 3;

        let checksUnderstanding = 1;
        if (understandingChecks >= 2) checksUnderstanding = 5;
        else if (understandingChecks >= 1) checksUnderstanding = 4;
        else if (questionMarks >= 1) checksUnderstanding = 2;

        const redFlags = [];
        if (givesAnswerEarly) redFlags.push('Gives the answer very early.');
        if (asksButNoSubstance) redFlags.push('Uses questions, but they may be too vague or too short to support learning.');
        if (conceptMoves === 0) redFlags.push('Does not clearly name or explain the underlying concept.');
        if (scaffoldingMoves === 0) redFlags.push('Does not provide a clear next step or scaffold.');
        if (understandingChecks === 0) redFlags.push('Does not clearly check for student understanding.');
        if (tooShort) redFlags.push('Response is very short, so the judgment is less reliable.');

        const evidence = {
          resistsShortcutting: givesAnswerEarly
            ? 'A direct-answer phrase appears near the beginning.'
            : 'The response does not appear to lead immediately with the final answer.',
          activatesThinking:
            meaningfulQuestions > 0
              ? `${meaningfulQuestions} meaningful thinking prompt(s) detected.`
              : `${questionMarks} question mark(s) detected, but few strong thinking prompts.`,
          scaffolds:
            scaffoldingMoves > 0
              ? `${scaffoldingMoves} scaffolding cue(s) detected.`
              : 'Few explicit scaffolding cues detected.',
          surfacesConcepts:
            conceptMoves > 0
              ? `${conceptMoves} concept cue(s) detected.`
              : 'Few conceptual explanation cues detected.',
          checksUnderstanding:
            understandingChecks > 0
              ? `${understandingChecks} understanding-check cue(s) detected.`
              : 'No strong understanding-check cue detected.',
        };

        return {
          scores: {
            resistsShortcutting: clamp(resistsShortcutting),
            activatesThinking: clamp(activatesThinking),
            scaffolds: clamp(scaffolds),
            surfacesConcepts: clamp(surfacesConcepts),
            checksUnderstanding: clamp(checksUnderstanding),
          },
          evidence,
          redFlags,
          reasoning: {
            resistsShortcutting: givesAnswerEarly
              ? 'The response appears to provide the final answer before prompting student thinking.'
              : 'The response appears to avoid immediately giving away the final answer.',
            activatesThinking: meaningfulQuestions > 0
              ? 'The response includes prompts that may require the student to reason or explain.'
              : 'The response includes limited evidence of active student thinking.',
            scaffolds: scaffoldingMoves > 0
              ? 'The response gives some structure for how the student should proceed.'
              : 'The response could provide clearer step-by-step support.',
            surfacesConcepts: conceptMoves > 0
              ? 'The response uses language connected to concepts or reasoning.'
              : 'The response could do more to surface the underlying concept.',
            checksUnderstanding: understandingChecks > 0
              ? 'The response asks the student to explain, try, or reflect.'
              : 'The response could end with a stronger check for understanding.',
          },
          suggestions: {
            resistsShortcutting: 'Ask the student to identify the rule, pattern, or first step before revealing the answer.',
            activatesThinking: 'Use prompts like “What do you notice?”, “Which rule applies?”, or “Where would you start?”',
            scaffolds: 'Break the help into a sequence such as first, next, then, and now you try.',
            surfacesConcepts: 'Name the core idea and explain why it applies in this problem.',
            checksUnderstanding: 'End by asking the student to explain the idea in their own words or try a similar step.',
          },
        };
      }

      // Score bar UI
      function ScoreBar({ score }) {
        const [width, setWidth] = useState(0);

        useEffect(() => {
          setWidth(0);
          const timer = setTimeout(() => {
            setWidth((score / 5) * 100);
          }, 120);

          return () => clearTimeout(timer);
        }, [score]);

        return (
          <div className="bar-track">
            <div
              className="bar-fill"
              style={{
                width: `${width}%`,
                background: scoreColor(score),
              }}
            />
          </div>
        );
      }

      function AnimatedScoreNumber({ value, revealKey }) {
        const [displayValue, setDisplayValue] = useState(0);

        useEffect(() => {
          let start = null;
          let animationFrame = null;
          const duration = 650;
          const target = Number(value);

          function animate(timestamp) {
            if (!start) start = timestamp;
            const progress = Math.min((timestamp - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            setDisplayValue(target * eased);

            if (progress < 1) {
              animationFrame = requestAnimationFrame(animate);
            }
          }

          setDisplayValue(0);
          animationFrame = requestAnimationFrame(animate);

          return () => cancelAnimationFrame(animationFrame);
        }, [value, revealKey]);

        return <div className="score-number">{displayValue.toFixed(0)}</div>;
      }

      function TotalScoreBar({ value, max = 25, revealKey }) {
        const [width, setWidth] = useState(0);

        useEffect(() => {
          setWidth(0);
          const timer = setTimeout(() => {
            setWidth((value / max) * 100);
          }, 180);

          return () => clearTimeout(timer);
        }, [value, max, revealKey]);

        return (
          <div className="total-score-track" aria-label={`Total score ${value} out of ${max}`}>
            <div
              className="total-score-fill"
              style={{ width: `${width}%` }}
            />
          </div>
        );
      }

      function ResultsPanel({ result, revealKey }) {
        if (!result) {
          return (
            <div className="empty-state">
              Enter a student question and a tutor response, then click <strong>Evaluate Response</strong>.
            </div>
          );
        }

        const total = RUBRIC.reduce((sum, item) => sum + result.scores[item.key], 0);

        return (
          <>
            <div className="score-summary">
              <AnimatedScoreNumber value={total} revealKey={revealKey} />
              <div className="score-summary-text">
                <div className="score-label">total score out of 25</div>
                <TotalScoreBar value={total} max={25} revealKey={revealKey} />
              </div>
            </div>

            {result.redFlags && result.redFlags.length > 0 && (
              <div className="red-flags">
                <h3>Red flags</h3>
                <ul>
                  {result.redFlags.map((flag, index) => (
                    <li key={index}>{flag}</li>
                  ))}
                </ul>
              </div>
            )}

            {RUBRIC.map((item, index) => {
              const score = result.scores[item.key];

              return (
                <div
                  className="rubric-item"
                  key={item.key}
                  style={{ animationDelay: `${0.18 + index * 0.09}s` }}
                >
                  <div className="rubric-header">
                    <span>{item.label}</span>
                    <span
                      className="score-pill"
                      style={{ background: scoreColor(score) }}
                    >
                      {score}/5
                    </span>
                  </div>

                  <ScoreBar score={score} />

                  {result.evidence && (
                    <p className="evidence">
                      <strong>Evidence:</strong> {result.evidence[item.key]}
                    </p>
                  )}

                  <p className="reasoning">
                    <strong>Reasoning:</strong> {result.reasoning[item.key]}
                  </p>

                  <p className="suggestion">
                    <strong>Suggestion:</strong> {result.suggestions[item.key]}
                  </p>
                </div>
              );
            })}
          </>
        );
      }

      // Main App
      function App() {
        const [question, setQuestion] = useState('');
        const [response, setResponse] = useState('');
        const [result, setResult] = useState(null);
        const [revealKey, setRevealKey] = useState(0);

        const judge = () => {
          setResult(analyzeTranscript(response, question));
          setRevealKey((current) => current + 1);
        };

        const clearAll = () => {
          setQuestion('');
          setResponse('');
          setResult(null);
          setRevealKey(0);
        };

        return (
          <main className="page">
            <section className="hero">
              <div className="hero-content">
                <div className="eyebrow">Learning-first evaluator</div>
                <h1>Tutor Response Judge</h1>
                <p className="subtitle">
                  Paste a student question and a tutor response. This tool gives a quick heuristic score based on whether the response is scaffolded, concept-focused, and encourages student thinking.
                </p>
              </div>
            </section>

            <section className="grid">
              <div className="card">
                <h2>✍️ Input</h2>

                <label htmlFor="question">Student question</label>
                <textarea
                  id="question"
                  rows="5"
                  placeholder="Example: What is the derivative of x^2?"
                  value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                />

                <label htmlFor="response">Tutor response or transcript</label>
                <textarea
                  id="response"
                  rows="12"
                  placeholder="Paste the tutor response here..."
                  value={response}
                  onChange={(e) => setResponse(e.target.value)}
                />

                <button onClick={judge}>Evaluate Response</button>
                <button className="secondary" onClick={clearAll}>Clear</button>
              </div>

              <div className="card">
                <h2>📊 Rubric Results</h2>
                <ResultsPanel result={result} revealKey={revealKey} />
              </div>
            </section>
          </main>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
