      @keyframes revealPanel {

      @keyframes scorePop {

      @keyframes rubricReveal {

      @media (prefers-reduced-motion: reduce) {

        *::before,
        *::after {

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useState } = React;

      // Color helper
      const scoreColor = (n) =>
        n === 0 ? '#dc2626' : n === 1 ? '#f59e0b' : '#16a34a';

      // Rubric
      const RUBRIC = [
        { key: 'resistsShortcutting', label: 'Resists Shortcutting' },
        { key: 'activatesThinking', label: 'Activates Thinking' },
        { key: 'scaffolds', label: 'Scaffolds Appropriately' },
        { key: 'surfacesConcepts', label: 'Surfaces Concepts' },
        { key: 'checksUnderstanding', label: 'Checks Understanding' },
      ];

      // Convert the internal 1-5 heuristic to a simpler 0-2 score.
      // 0 = weak support, 1 = partial support, 2 = strong support.
      function clampFive(n) {
        return Math.max(1, Math.min(5, n));
      }

      function toTwoPointScore(n) {
        const clamped = clampFive(n);
        if (clamped <= 2) return 0;
        if (clamped <= 4) return 1;
        return 2;
      }

      // Improved heuristic judge
      function analyzeTranscript(text, question) {
        const cleanText = (text || '').trim();
        const lower = cleanText.toLowerCase();

        const words = cleanText.match(/[A-Za-z0-9_]+/g) || [];
        const wordCount = words.length;
        const firstChunk = lower.slice(0, 180);
        const firstTutorChunk = firstChunk.startsWith('tutor:') ? firstChunk.slice(6).trim() : firstChunk;
        const sentences = cleanText
          .split(/[.!?]+/)
          .map((s) => s.trim())
          .filter(Boolean);

        const questionMarks = [...cleanText].filter((ch) => ch === '?').length;

        const meaningfulQuestionPatterns = [
          /what do you notice/i,
          /what rule/i,
          /which rule/i,
          /what would/i,
          /what happens/i,
          /how do you know/i,
          /why/i,
          /can you/i,
          /try/i,
          /your reasoning/i,
          /in your own words/i,
          /before we/i,
          /where would you start/i,
          /what property/i,
          /what trend/i,
          /what does the x-axis/i,
          /what does the y-axis/i,
          /do the scenario/i,
          /what benefit/i,
          /choose/i,
          /what outdoor/i,
          /what is one/i,
          /how did it/i,
          /what would you say/i,
          /what do you already know/i,
          /does ozone/i,
          /is it/i,
          /or is/i,
          /how would you summarize/i,
          /now what is/i,
          /what is the derivative/i,
        ];

        const scaffoldPatterns = [
          /first/i,
          /next/i,
          /then/i,
          /start by/i,
          /let's break/i,
          /one step/i,
          /step/i,
          /hint/i,
          /try/i,
          /look at/i,
          /compare/i,
          /instead of/i,
          /let's identify/i,
          /identify the/i,
          /if we think of this as/i,
          /outside function/i,
          /inside function/i,
          /what would u be/i,
          /what would .* be/i,
          /now what is/i,
          /multiply those pieces/i,
          /evaluated at the inside/i,
          /build it/i,
          /build/i,
          /choose/i,
          /add one/i,
          /shape/i,
          /scaffold/i,
          /main idea/i,
          /concrete example/i,
          /final insight/i,
          /revise/i,
          /identify the axes/i,
          /x-axis/i,
          /y-axis/i,
          /visual pattern/i,
          /policy implication/i,
          /two-sentence/i,
          /2-3 sentence/i,
          /summary should/i,
          /before answering/i,
          /reason it out/i,
          /location matters/i,
          /summarize the answer/i,
          /one or two sentences/i,
        ];

        const conceptPatterns = [
          /because/i,
          /means/i,
          /represents/i,
          /concept/i,
          /rule/i,
          /power rule/i,
          /slope/i,
          /rate of change/i,
          /derivative/i,
          /exponent/i,
          /coefficient/i,
          /constant/i,
          /chain rule/i,
          /product rule/i,
          /quotient rule/i,
          /outside function/i,
          /inside function/i,
          /nested inside/i,
          /greenhouse gas/i,
          /infrared/i,
          /longwave/i,
          /radiation/i,
          /atmosphere/i,
          /ozone/i,
          /stratospheric/i,
          /tropospheric/i,
          /ground-level/i,
          /pollutant/i,
          /uv/i,
          /reflective/i,
          /paragraph/i,
          /main idea/i,
          /benefit/i,
          /specific/i,
          /example/i,
          /voice/i,
          /revise/i,
          /figure/i,
          /axis/i,
          /axes/i,
          /cumulative/i,
          /co2/i,
          /emissions/i,
          /global surface temperature/i,
          /warming/i,
          /near-linear/i,
          /net zero/i,
          /scenario/i,
          /policy implication/i,
        ];

        const understandingCheckPatterns = [
          /does that make sense/i,
          /can you explain/i,
          /can you tell me/i,
          /what would you do next/i,
          /in your own words/i,
          /try one/i,
          /now you try/i,
          /what do you think/i,
          /why do you think/i,
          /what answer do you get/i,
          /try writing/i,
          /try a/i,
          /what would you say/i,
          /what trend do you notice/i,
          /can you explain the difference/i,
          /explain why/i,
          /what is one outdoor/i,
        ];

        const deepUnderstandingCheckPatterns = [
          /in your own words/i,
          /can you explain/i,
          /explain why/i,
          /what answer do you get/i,
          /try writing/i,
          /now you try/i,
          /what would you say/i,
          /what trend do you notice/i,
          /can you explain the difference/i,
          /how would you summarize/i,
        ];

        const productionPromptPatterns = [
          /what answer do you get/i,
          /try writing/i,
          /now you try/i,
          /what would you say/i,
          /how would you summarize/i,
          /write a/i,
          /draft/i,
          /summarize/i,
          /explain in your own words/i,
          /can you explain/i,
          /put those pieces together/i,
          /what benefit do you want to focus on/i,
          /what trend do you notice/i,
          /what is your first sentence/i,
        ];

        const directAnswerPatterns = [
          /the answer is/i,
          /the derivative is/i,
          /the correct answer is/i,
          /final answer/i,
          /so the answer/i,
          /^yes($|[^a-z0-9])/i,
          /^no($|[^a-z0-9])/i,
          /^here is/i,
          /^here's/i,
          /^figure .* shows/i,
          /^the figure shows/i,
          /^spending time outside/i,
          /^use the power rule/i,
          /^this is the power rule/i,
          /^this is chain rule/i,
          /^this is a chain rule/i,
          /^the chain rule gives/i,
          /^2x([^a-z0-9]|$)/i,
          /15x.?2/i,
          /3x.?2.*cos/i,
        ];

        const meaningfulQuestions = meaningfulQuestionPatterns.filter((p) => p.test(cleanText)).length;
        const scaffoldingMoves = scaffoldPatterns.filter((p) => p.test(cleanText)).length;
        const conceptMoves = conceptPatterns.filter((p) => p.test(cleanText)).length;
        const understandingChecks = understandingCheckPatterns.filter((p) => p.test(cleanText)).length;
        const deepUnderstandingChecks = deepUnderstandingCheckPatterns.filter((p) => p.test(cleanText)).length;

        const transcriptLines = cleanText.split('
').map((line) => line.trim()).filter(Boolean);
        const studentLines = transcriptLines.filter((line) => line.toLowerCase().startsWith('student:'));
        const tutorLines = transcriptLines.filter((line) => line.toLowerCase().startsWith('tutor:'));
        const studentResponseWordCounts = studentLines.map((line) => {
          const responseOnly = line.slice(line.indexOf(':') + 1).trim();
          const responseWords = responseOnly.match(/[A-Za-z0-9_]+/g) || [];
          return responseWords.length;
        });
        const totalStudentWords = studentResponseWordCounts.reduce((sum, count) => sum + count, 0);
        const averageStudentWords = studentResponseWordCounts.length > 0
          ? totalStudentWords / studentResponseWordCounts.length
          : 0;
        const substantialStudentResponses = studentResponseWordCounts.filter((count) => count >= 5).length;
        const hasDialogue = studentLines.length >= 2 && tutorLines.length >= 2;
        const hasEngagedDialogue = hasDialogue && (averageStudentWords >= 4 || substantialStudentResponses >= 2);
        const hasMinimalStudentDialogue = hasDialogue && totalStudentWords > 0 && averageStudentWords < 3;
        const asksForProductiveResponse = productionPromptPatterns.some((p) => p.test(cleanText));
        const hasExcellentEngagement =
          hasDialogue &&
          substantialStudentResponses >= 2 &&
          totalStudentWords >= 24 &&
          (averageStudentWords >= 7 || studentLines.length >= 3) &&
          (deepUnderstandingChecks >= 1 || asksForProductiveResponse || meaningfulQuestions >= 3);
        const hasNoStudentReplies = studentLines.length === 0;

        const givesAnswerEarly = directAnswerPatterns.some((p) => p.test(firstChunk) || p.test(firstTutorChunk));
        const givesFinalAnswerAnywhere = directAnswerPatterns.some((p) => p.test(cleanText));
        const weakExplanationMarkers = /because|so|therefore|absorbs|pollutant|power rule|chain rule|bring the|subtract|multiply by|paragraph|relax|exercise|health|screens|near-linear|relationship|cumulative|policy|axis|axes/i;
        const weakDirectExplanation =
          givesAnswerEarly &&
          sentences.length >= 2 &&
          (wordCount >= 24 || weakExplanationMarkers.test(cleanText)) &&
          (conceptMoves >= 1 || scaffoldingMoves >= 1);
        const softEarlyGuidance = givesAnswerEarly && !givesFinalAnswerAnywhere && meaningfulQuestions >= 1 && scaffoldingMoves >= 2;

        const asksButNoSubstance = questionMarks >= 3 && wordCount < 25;
        const tooShort = wordCount < 18;
        const hasMultiStep = sentences.length >= 3 || scaffoldingMoves >= 2;


        let resistsShortcutting = 3;
        if (givesAnswerEarly && !softEarlyGuidance) resistsShortcutting = 1;
        else if (givesAnswerEarly && softEarlyGuidance) resistsShortcutting = 3;
        else if (!givesFinalAnswerAnywhere && meaningfulQuestions >= 2) resistsShortcutting = 5;
        else if (!givesFinalAnswerAnywhere && meaningfulQuestions >= 1) resistsShortcutting = 4;

        if (hasExcellentEngagement && !givesAnswerEarly) {
          resistsShortcutting = Math.max(resistsShortcutting, 5);
        }

        let activatesThinking = 1;
        if (asksButNoSubstance) activatesThinking = 2;
        else if (meaningfulQuestions >= 3) activatesThinking = 5;
        else if (meaningfulQuestions >= 2) activatesThinking = 4;
        else if (meaningfulQuestions >= 1 || questionMarks >= 1) activatesThinking = 3;

        if (hasExcellentEngagement) activatesThinking = Math.max(activatesThinking, 5);
        else if (hasEngagedDialogue) activatesThinking = Math.max(activatesThinking, 4);
        else if (hasDialogue && totalStudentWords > 0) activatesThinking = Math.max(activatesThinking, 4);

        let scaffolds = 1;
        if (hasMultiStep && scaffoldingMoves >= 2) scaffolds = 5;
        else if (hasMultiStep || scaffoldingMoves >= 2) scaffolds = 4;
        else if (scaffoldingMoves >= 1 || sentences.length >= 2) scaffolds = 3;

        let surfacesConcepts = 1;
        if (conceptMoves >= 4) surfacesConcepts = 5;
        else if (conceptMoves >= 2) surfacesConcepts = 4;
        else if (conceptMoves >= 1) surfacesConcepts = 3;

        let checksUnderstanding = 1;
        if (hasExcellentEngagement || (deepUnderstandingChecks >= 2 && substantialStudentResponses >= 2)) checksUnderstanding = 5;
        else if (hasEngagedDialogue || deepUnderstandingChecks >= 1 || understandingChecks >= 2 || substantialStudentResponses >= 1) checksUnderstanding = 4;
        else if (understandingChecks >= 1) checksUnderstanding = 3;
        else if (questionMarks >= 1) checksUnderstanding = 2;

        if (hasMinimalStudentDialogue && meaningfulQuestions >= 2) {
          checksUnderstanding = Math.min(checksUnderstanding, 3);
        }

        // If the response starts by giving the answer, it should not score highly
        // for learning support just because it contains concept vocabulary.
        if (givesAnswerEarly && !softEarlyGuidance && !weakDirectExplanation) {
          activatesThinking = Math.min(activatesThinking, 2);
          scaffolds = Math.min(scaffolds, 2);
          surfacesConcepts = Math.min(surfacesConcepts, 3);
          checksUnderstanding = Math.min(checksUnderstanding, 2);
        } else if (givesAnswerEarly && weakDirectExplanation && !softEarlyGuidance) {
          // Weak direct answers still give away the answer, but receive limited credit
          // if they include some explanation, concept language, or procedure.
          activatesThinking = Math.min(activatesThinking, 2);
          scaffolds = Math.max(Math.min(scaffolds, 3), 3);
          surfacesConcepts = Math.max(Math.min(surfacesConcepts, 4), 3);
          checksUnderstanding = Math.min(checksUnderstanding, 2);
        } else if (softEarlyGuidance) {
          activatesThinking = Math.min(activatesThinking, 4);
          checksUnderstanding = Math.min(checksUnderstanding, 3);
        }

        // Calibration cap: a polished explanation without student replies should not
        // score as highly as an interactive transcript, unless it clearly asks the
        // learner to produce an answer, sentence, explanation, or summary.
        if (hasNoStudentReplies) {
          let totalScore = resistsShortcutting + activatesThinking + scaffolds + surfacesConcepts + checksUnderstanding;
          const reductionOrder = ['checksUnderstanding', 'activatesThinking', 'scaffolds', 'surfacesConcepts'];

          while (totalScore > 20) {
            let changed = false;

            for (const category of reductionOrder) {
              if (totalScore <= 20) break;

              if (category === 'checksUnderstanding' && checksUnderstanding > 1) {
                checksUnderstanding -= 1;
                totalScore -= 1;
                changed = true;
              } else if (category === 'activatesThinking' && activatesThinking > 1) {
                activatesThinking -= 1;
                totalScore -= 1;
                changed = true;
              } else if (category === 'scaffolds' && scaffolds > 1) {
                scaffolds -= 1;
                totalScore -= 1;
                changed = true;
              } else if (category === 'surfacesConcepts' && surfacesConcepts > 1) {
                surfacesConcepts -= 1;
                totalScore -= 1;
                changed = true;
              }
            }

            if (!changed) break;
          }
        }

        if (hasDialogue && !hasExcellentEngagement && !givesAnswerEarly) {
          let totalScore = resistsShortcutting + activatesThinking + scaffolds + surfacesConcepts + checksUnderstanding;
          const reductionOrder = ['checksUnderstanding', 'activatesThinking', 'scaffolds', 'surfacesConcepts'];

          while (totalScore > 23) {
            let changed = false;

            for (const category of reductionOrder) {
              if (totalScore <= 23) break;

              if (category === 'checksUnderstanding' && checksUnderstanding > 1) {
                checksUnderstanding -= 1;
                totalScore -= 1;
                changed = true;
              } else if (category === 'activatesThinking' && activatesThinking > 1) {
                activatesThinking -= 1;
                totalScore -= 1;
                changed = true;
              } else if (category === 'scaffolds' && scaffolds > 1) {
                scaffolds -= 1;
                totalScore -= 1;
                changed = true;
              } else if (category === 'surfacesConcepts' && surfacesConcepts > 1) {
                surfacesConcepts -= 1;
                totalScore -= 1;
                changed = true;
              }
            }

            if (!changed) break;
          }
        }

        const redFlags = [];
        if (givesAnswerEarly && !softEarlyGuidance && !weakDirectExplanation) redFlags.push('Gives the answer very early, which limits student thinking.');
        if (givesAnswerEarly && weakDirectExplanation && !softEarlyGuidance) redFlags.push('Gives the answer early, but includes limited explanatory support.');
        if (softEarlyGuidance) redFlags.push('Names the rule early, but still scaffolds the student toward the next step.');
        if (asksButNoSubstance) redFlags.push('Uses questions, but they may be too vague or too short to support learning.');
        if (conceptMoves === 0) redFlags.push('Does not clearly name or explain the underlying concept.');
        if (scaffoldingMoves === 0) redFlags.push('Does not provide a clear next step or scaffold.');
        if (understandingChecks === 0) redFlags.push('Does not clearly check for student understanding.');
        if (tooShort) redFlags.push('Response is very short, so the judgment is less reliable.');
        if (hasMinimalStudentDialogue) redFlags.push('Student replies are very short, so engagement may be limited.');
        if (hasNoStudentReplies) redFlags.push('No student reply is shown, so the score is limited.');

        const evidence = {
          resistsShortcutting: givesAnswerEarly
            ? 'A direct-answer phrase appears near the beginning.'
            : 'The response does not appear to lead immediately with the final answer.',
          activatesThinking:
            hasDialogue
              ? `${meaningfulQuestions} thinking prompt(s) detected; student responses average ${averageStudentWords.toFixed(1)} word(s).`
              : meaningfulQuestions > 0
                ? `${meaningfulQuestions} meaningful thinking prompt(s) detected.`
                : `${questionMarks} question mark(s) detected, but few strong thinking prompts.`,
          scaffolds:
            scaffoldingMoves > 0
              ? `${scaffoldingMoves} scaffolding cue(s) detected.`
              : 'Few explicit scaffolding cues detected.',
          surfacesConcepts:
            conceptMoves > 0
              ? `${conceptMoves} concept cue(s) detected.`
              : 'Few conceptual explanation cues detected.',
          checksUnderstanding:
            hasEngagedDialogue
              ? `Student responses suggest engagement: ${totalStudentWords} total student word(s) across ${studentLines.length} response(s).`
              : understandingChecks > 0
                ? `${understandingChecks} understanding-check cue(s) detected.`
                : 'No strong understanding-check cue detected.',
        };

        return {
          scores: {
            resistsShortcutting: toTwoPointScore(resistsShortcutting),
            activatesThinking: toTwoPointScore(activatesThinking),
            scaffolds: toTwoPointScore(scaffolds),
            surfacesConcepts: toTwoPointScore(surfacesConcepts),
            checksUnderstanding: toTwoPointScore(checksUnderstanding),
          },
          evidence,
          redFlags,
          reasoning: {
            resistsShortcutting: givesAnswerEarly
              ? 'The response appears to provide the final answer before prompting student thinking.'
              : 'The response appears to avoid immediately giving away the final answer.',
            activatesThinking: hasEngagedDialogue
              ? 'The transcript shows the student giving substantive responses to tutor prompts.'
              : meaningfulQuestions > 0
                ? 'The response includes prompts that may require the student to reason or explain.'
                : 'The response includes limited evidence of active student thinking.',
            scaffolds: scaffoldingMoves > 0
              ? 'The response gives some structure for how the student should proceed.'
              : 'The response could provide clearer step-by-step support.',
            surfacesConcepts: conceptMoves > 0
              ? 'The response uses language connected to concepts or reasoning.'
              : 'The response could do more to surface the underlying concept.',
            checksUnderstanding: hasEngagedDialogue
              ? 'The student response length suggests the tutor is checking and extending understanding.'
              : understandingChecks > 0
                ? 'The response asks the student to explain, try, or reflect.'
                : 'The response could end with a stronger check for understanding.',
          },
          suggestions: {
            resistsShortcutting: 'Ask the student to identify the rule, pattern, or first step before revealing the answer.',
            activatesThinking: 'Use prompts like “What do you notice?”, “Which rule applies?”, or “Where would you start?”',
            scaffolds: 'Break the help into a sequence such as first, next, then, and now you try.',
            surfacesConcepts: 'Name the core idea and explain why it applies in this problem.',
            checksUnderstanding: 'End by asking the student to explain the idea in their own words, then look for a substantive student response.'
          },
        };
      }

      // Score bar UI
      function ScoreBar({ score }) {
        const [width, setWidth] = useState(0);

        useEffect(() => {
          setWidth(0);
          const timer = setTimeout(() => {
            setWidth((score / 2) * 100);
          }, 120);

          return () => clearTimeout(timer);
        }, [score]);

        return (
          <div className="bar-track">
            <div
              className="bar-fill"
              style={{
                width: `${width}%`,
                background: scoreColor(score),
              }}
            />
          </div>
        );
      }

      function AnimatedScoreNumber({ value, revealKey }) {
        const [displayValue, setDisplayValue] = useState(0);

        useEffect(() => {
          let start = null;
          let animationFrame = null;
          const duration = 650;
          const target = Number(value);

          function animate(timestamp) {
            if (!start) start = timestamp;
            const progress = Math.min((timestamp - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            setDisplayValue(target * eased);

            if (progress < 1) {
              animationFrame = requestAnimationFrame(animate);
            }
          }

          setDisplayValue(0);
          animationFrame = requestAnimationFrame(animate);

          return () => cancelAnimationFrame(animationFrame);
        }, [value, revealKey]);

        return <div className="score-number">{displayValue.toFixed(0)}</div>;
      }

      function TotalScoreBar({ value, max = 10, revealKey }) {
        const [width, setWidth] = useState(0);

        useEffect(() => {
          setWidth(0);
          const timer = setTimeout(() => {
            setWidth((value / max) * 100);
          }, 180);

          return () => clearTimeout(timer);
        }, [value, max, revealKey]);

        return (
          <div className="total-score-track" aria-label={`Total score ${value} out of ${max}`}>
            <div
              className="total-score-fill"
              style={{ width: `${width}%` }}
            />
          </div>
        );
      }

      function ResultsPanel({ result, revealKey }) {
        if (!result) {
          return (
            <div className="empty-state">
              Enter a student question and a tutor response, then click <strong>Evaluate Response</strong>.
            </div>
          );
        }

        const total = RUBRIC.reduce((sum, item) => sum + result.scores[item.key], 0);

        return (
          <>
            <div className="score-summary">
              <AnimatedScoreNumber value={total} revealKey={revealKey} />
              <div className="score-summary-text">
                <div className="score-label">total score out of 10</div>
                <TotalScoreBar value={total} max={10} revealKey={revealKey} />
              </div>
            </div>

            {result.redFlags && result.redFlags.length > 0 && (
              <div className="red-flags">
                <h3>Red flags</h3>
                <ul>
                  {result.redFlags.map((flag, index) => (
                    <li key={index}>{flag}</li>
                  ))}
                </ul>
              </div>
            )}

            {RUBRIC.map((item, index) => {
              const score = result.scores[item.key];

              return (
                <div
                  className="rubric-item"
                  key={item.key}
                  style={{ animationDelay: `${0.18 + index * 0.09}s` }}
                >
                  <div className="rubric-header">
                    <span>{item.label}</span>
                    <span
                      className="score-pill"
                      style={{ background: scoreColor(score) }}
                    >
                      {score}/2
                    </span>
                  </div>

                  <ScoreBar score={score} />

                  {result.evidence && (
                    <p className="evidence">
                      <strong>Evidence:</strong> {result.evidence[item.key]}
                    </p>
                  )}

                  <p className="reasoning">
                    <strong>Reasoning:</strong> {result.reasoning[item.key]}
                  </p>

                  <p className="suggestion">
                    <strong>Suggestion:</strong> {result.suggestions[item.key]}
                  </p>
                </div>
              );
            })}
          </>
        );
      }

      // Main App
      function App() {
        const [question, setQuestion] = useState('');
        const [response, setResponse] = useState('');
        const [result, setResult] = useState(null);
        const [revealKey, setRevealKey] = useState(0);

        const judge = () => {
          setResult(analyzeTranscript(response, question));
          setRevealKey((current) => current + 1);
        };

        const clearAll = () => {
          setQuestion('');
          setResponse('');
          setResult(null);
          setRevealKey(0);
        };

        return (
          <main className="page">
            <section className="hero">
              <div className="hero-content">
                <div className="eyebrow">Learning-first evaluator</div>
                <h1>Tutor Response Judge</h1>
                <p className="subtitle">
                  Paste a student question and a tutor response. This tool gives a quick heuristic score based on whether the response is scaffolded, concept-focused, and encourages student thinking.
                </p>
              </div>
            </section>

            <section className="grid">
              <div className="card">
                <h2>✍️ Input</h2>

                <label htmlFor="question">Student question</label>
                <textarea
                  id="question"
                  rows="5"
                  placeholder="Example: What is the derivative of x^2?"
                  value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                />

                <label htmlFor="response">Tutor response or transcript</label>
                <textarea
                  id="response"
                  rows="12"
                  placeholder="Paste the tutor response here..."
                  value={response}
                  onChange={(e) => setResponse(e.target.value)}
                />

                <button onClick={judge}>Evaluate Response</button>
                <button className="secondary" onClick={clearAll}>Clear</button>
              </div>

              <div className="card">
                <h2>📊 Rubric Results</h2>
                <ResultsPanel result={result} revealKey={revealKey} />
              </div>
            </section>
          </main>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
